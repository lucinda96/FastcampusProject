server:
  port: 8080
spring:
  application:
    name: board
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3308/board
    username: root
    password: root
  cache: #redis
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      repositories:
        enabled: false
expire:
  defaultTime: 3600 #1ch

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml